# Build file .ipa (chưa ký).
# - Repo đã bung source: chạy thẳng.
# - Repo chỉ có file ZIP: bước đầu tự unzip.
# Bấm Actions → "2. Build IPA" → Run workflow → Artifacts.
name: "2. Build IPA"

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ios-ipa.yml"
      - "capacitor.config.ts"
      - "index.native.html"
      - "ios/**"
      - "package.json"
      - "package-lock.json"
      - "public/**"
      - "scripts/**"
      - "src/**"
      - "vite.native.config.ts"

jobs:
  ipa:
    name: Bung ZIP (nếu cần) + xcodebuild
    runs-on: macos-latest
    steps:
      - name: Lấy repo
        uses: actions/checkout@v4

      - name: Bung ZIP nếu chưa có source
        run: |
          set -euo pipefail
          echo "=================================================="
          echo " BƯỚC 1/5 — Kiểm tra source"
          echo "=================================================="
          if [ -f package.json ]; then
            echo "Đã có package.json — bỏ qua unzip."
            exit 0
          fi
          ZIP=$(find . -maxdepth 3 -type f \( -name 'GPS-Speedometer*.zip' -o -name '*.zip' \) \
            ! -path './.git/*' | head -n1)
          if [ -z "${ZIP}" ]; then
            echo "::error::Repo chưa có source và chưa có file ZIP."
            echo "Upload GPS-Speedometer-github.zip, hoặc chạy workflow \"1. Bung ZIP lên repo\" trước."
            ls -la
            exit 1
          fi
          echo "Tự bung: ${ZIP}"
          mkdir -p .unpack
          unzip -o "${ZIP}" -d .unpack
          INNER=$(find .unpack -mindepth 1 -maxdepth 1)
          COUNT=$(echo "${INNER}" | grep -c . || true)
          if [ "${COUNT}" = "1" ] && [ -d "${INNER}" ]; then
            cp -a "${INNER}"/. .
          else
            cp -a .unpack/. .
          fi
          rm -rf .unpack
          ls -la
          test -f package.json

      - name: Cài Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: npm ci + build Capacitor www
        run: |
          set -euo pipefail
          echo "=================================================="
          echo " BƯỚC 2/5 — npm ci"
          echo "=================================================="
          npm ci
          echo "=================================================="
          echo " BƯỚC 3/5 — vite build → www + cap sync ios"
          echo "=================================================="
          npm run build:ios
          npx cap sync ios
          python3 scripts/sync-ios-icons.py
          node scripts/patch-ios-plist.mjs
          test -d ios/App

      - name: xcodebuild → IPA (chưa ký)
        run: |
          set -euo pipefail
          echo "=================================================="
          echo " BƯỚC 4/5 — xcodebuild archive"
          echo "=================================================="
          cd ios/App
          xcodebuild \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive
          APP=$(find build/App.xcarchive/Products/Applications -name '*.app' | head -n1)
          echo "App: ${APP}"
          rm -rf Payload GPS-Speedometer.ipa
          mkdir Payload
          cp -R "${APP}" Payload/App.app
          zip -r GPS-Speedometer.ipa Payload
          echo "=================================================="
          echo " BƯỚC 5/5 — IPA"
          echo "=================================================="
          ls -lh GPS-Speedometer.ipa

      - name: Upload artifact GPS-Speedometer.ipa
        uses: actions/upload-artifact@v4
        with:
          name: GPS-Speedometer.ipa
          path: ios/App/GPS-Speedometer.ipa
          if-no-files-found: error
