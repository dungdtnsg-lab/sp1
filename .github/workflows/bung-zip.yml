name: "1. Bung ZIP lên repo"

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bung:
    name: Unzip và commit
    runs-on: ubuntu-latest
    steps:
      - name: Lấy repo
        uses: actions/checkout@v4

      - name: Tìm file ZIP rồi bung
        run: |
          set -euo pipefail
          ZIP=$(find . -maxdepth 3 -type f \( -name 'GPS-Speedometer*.zip' -o -name '*.zip' \) \
            ! -path './.git/*' ! -path './node_modules/*' | head -n1)
          if [ -z "${ZIP}" ]; then
            echo "::error::Không thấy file .zip. Upload GPS-Speedometer-github.zip vào root repo rồi chạy lại."
            ls -la
            exit 1
          fi
          echo "File zip: ${ZIP}"
          mkdir -p .unpack
          unzip -o "${ZIP}" -d .unpack
          INNER=$(find .unpack -mindepth 1 -maxdepth 1)
          COUNT=$(echo "${INNER}" | grep -c . || true)
          if [ "${COUNT}" = "1" ] && [ -d "${INNER}" ]; then
            echo "Lột thư mục gốc: ${INNER}"
            cp -a "${INNER}"/. .
          else
            cp -a .unpack/. .
          fi
          rm -rf .unpack
          ls -la
          test -f package.json
          test -f capacitor.config.ts

      - name: Commit source vào GitHub
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Không có gì mới"
            exit 0
          fi
          git commit -m "chore: bung GPS-Speedometer zip"
          git push
